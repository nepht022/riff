style:
  MagicNumber:
    active: false # parsers de formato de arquivo têm muitos códigos de protocolo
  ReturnCount:
    max: 4
naming:
  MatchingDeclarationName:
    active: false # arquivos Compose agrupam o componente com seus enums e tags de teste
  FunctionNaming:
    ignoreAnnotated: ['Composable']
complexity:
  # Testes dos módulos multiplataforma (androidHostTest, desktopTest) valem como os de src/test.
  TooManyFunctions:
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidHostTest/**', '**/desktopTest/**']
  LongParameterList:
    ignoreAnnotated: ['Composable']
performance:
  ForEachOnRange:
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidHostTest/**', '**/desktopTest/**']
