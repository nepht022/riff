name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # O modelo da guitarra por IA (130 MB) fica no Git LFS e os testes da separação o leem. A cota gratuita de download
      # do LFS é pequena: o modelo fica em cache e só é baixado de novo quando muda.
      - name: Lista dos arquivos do LFS
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Modelo da IA (LFS)
        run: git lfs pull
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # Os screenshots do celular são comparados exatos: no Linux o Robolectric desenha as telas iguais às
      # referências gravadas no Windows (conferido em 2026-10-30). As do PC (Skia) não: no Linux as letras e bordas
      # saem suavizadas de outro jeito (1,5–4% das telas, 2026-11-12) e os símbolos de fora das fontes do app mudam de
      # tamanho. Por isso o CI roda todos os testes do PC (desktopTest e test) sem comparar as imagens dele
      # (verifyRoborazziDesktop/Jvm ficam para o Windows, antes de cada merge).
      - name: Lint, testes, screenshots e build
        run: >-
          ./gradlew detekt lintDebug lintMultiplatform
          test testAndroidHostTest desktopTest
          verifyRoborazziAndroidHostTest
          koverVerify assembleDebug --continue
      # Quando algo falha, guarda as comparações das screenshots (referência, atual e diferença) e os relatórios dos
      # testes, para ver o que mudou sem repetir no Windows.
      - name: Comparações e relatórios (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: falhas-ci
          path: |
            **/build/outputs/roborazzi/**
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          retention-days: 7
          if-no-files-found: ignore
