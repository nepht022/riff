name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # O modelo da guitarra por IA (130 MB) fica no Git LFS e os testes da separação o leem. A cota gratuita de download
      # do LFS é pequena: o modelo fica em cache e só é baixado de novo quando muda.
      - name: Lista dos arquivos do LFS
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-assets-id
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-assets-id') }}
      - name: Modelo da IA (LFS)
        run: git lfs pull
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      # Os screenshots do celular são comparados exatos: no Linux o Robolectric desenha as telas iguais às
      # referências gravadas no Windows (conferido em 2026-10-30).
      # Módulos multiplataforma (celular e PC): testes Android em testAndroidHostTest, do PC em desktopTest/test,
      # screenshots em verifyRoborazziAndroidHostTest (Android), verifyRoborazziDesktop (o lado PC dos módulos) e
      # verifyRoborazziJvm (o app do PC); as do PC com 1% de tolerância
      # para a suavização das letras); lint de todos eles em lintMultiplatform.
      - name: Lint, testes, screenshots e build
        run: >-
          ./gradlew detekt lintDebug lintMultiplatform
          test testAndroidHostTest desktopTest
          verifyRoborazziAndroidHostTest verifyRoborazziDesktop verifyRoborazziJvm
          koverVerify assembleDebug
      # Quando algo falha, guarda as comparações das screenshots (referência, atual e diferença) e os relatórios dos
      # testes, para ver o que mudou sem repetir no Windows.
      - name: Comparações e relatórios (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: falhas-ci
          path: |
            **/build/outputs/roborazzi/**
            **/build/reports/tests/**
            **/build/test-results/**/*.xml
          retention-days: 7
          if-no-files-found: ignore
